<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园活动报名</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17223b;
      --muted: #667085;
      --brand: #3157d5;
      --brand-dark: #2341a5;
      --surface: rgba(255, 255, 255, .94);
      --line: #e6eaf2;
      --ok: #067647;
      --bad: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, #dce5ff 0, transparent 34%),
        radial-gradient(circle at 90% 90%, #d9f4ea 0, transparent 32%),
        #f6f8fc;
    }
    .wrap { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 52px 0; }
    header { margin-bottom: 28px; }
    .eyebrow { color: var(--brand); font-weight: 750; letter-spacing: .12em; font-size: 13px; }
    h1 { margin: 8px 0 10px; font-size: clamp(32px, 6vw, 54px); line-height: 1.05; }
    .lead { margin: 0; color: var(--muted); font-size: 17px; }
    .panel {
      padding: 24px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 18px 55px rgba(35, 65, 165, .10);
      backdrop-filter: blur(12px);
    }
    .toolbar { display: flex; gap: 12px; margin-bottom: 20px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 13px 15px;
      border: 1px solid #cfd6e6;
      border-radius: 12px;
      font: inherit;
      outline: none;
    }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px #dfe6ff; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      color: white;
      background: var(--brand);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--brand-dark); }
    button:disabled { opacity: .55; cursor: wait; }
    .activity {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 18px 0;
      border-top: 1px solid var(--line);
    }
    .activity:first-child { border-top: 0; }
    .activity h2 { margin: 0 0 7px; font-size: 20px; }
    .meta { margin: 0; color: var(--muted); }
    .status { min-height: 24px; margin: 16px 0 0; font-weight: 650; }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--bad); }
    .empty { color: var(--muted); padding: 24px 0; text-align: center; }
    footer { margin-top: 18px; color: var(--muted); font-size: 14px; }
    footer a { color: var(--brand); }
    @media (max-width: 600px) {
      .wrap { padding: 30px 0; }
      .toolbar { flex-direction: column; }
      .activity { grid-template-columns: 1fr; }
      .activity button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="eyebrow">CAMPUS EVENTS</div>
      <h1>校园活动报名</h1>
      <p class="lead">选择活动，填写学号，一键完成报名。</p>
    </header>

    <section class="panel" aria-labelledby="activity-title">
      <div class="toolbar">
        <input id="student-id" maxlength="40" autocomplete="off"
               placeholder="请输入学号，例如 20260001" aria-label="学号">
        <button id="refresh" type="button">刷新活动</button>
      </div>
      <div id="activities" aria-live="polite"><div class="empty">正在加载活动…</div></div>
      <p id="status" class="status" role="status"></p>
    </section>

    <footer>服务状态：<a href="/health">Health</a> · <a href="/ready">Ready</a> · <a href="/docs">API 文档</a></footer>
  </main>

  <script>
    const list = document.querySelector('#activities');
    const statusBox = document.querySelector('#status');
    const studentInput = document.querySelector('#student-id');
    const refreshButton = document.querySelector('#refresh');

    function showStatus(message, ok = true) {
      statusBox.textContent = message;
      statusBox.className = `status ${ok ? 'ok' : 'bad'}`;
    }

    async function loadActivities() {
      refreshButton.disabled = true;
      list.innerHTML = '<div class="empty">正在加载活动…</div>';
      try {
        const response = await fetch('/activities');
        if (!response.ok) throw new Error(`加载失败（HTTP ${response.status}）`);
        const activities = await response.json();
        if (!activities.length) {
          list.innerHTML = '<div class="empty">目前没有可报名的活动。</div>';
          return;
        }
        list.replaceChildren(...activities.map(renderActivity));
      } catch (error) {
        list.innerHTML = '<div class="empty">活动加载失败，请稍后重试。</div>';
        showStatus(error.message, false);
      } finally {
        refreshButton.disabled = false;
      }
    }

    function renderActivity(activity) {
      const row = document.createElement('article');
      row.className = 'activity';
      const info = document.createElement('div');
      const title = document.createElement('h2');
      title.textContent = activity.name;
      const meta = document.createElement('p');
      meta.className = 'meta';
      meta.textContent = `已报名 ${activity.registered} / ${activity.capacity} · 剩余 ${activity.remaining} 个名额`;
      info.append(title, meta);

      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = activity.remaining > 0 ? '立即报名' : '名额已满';
      button.disabled = activity.remaining <= 0;
      button.addEventListener('click', () => register(activity, button));
      row.append(info, button);
      return row;
    }

    async function register(activity, button) {
      const studentId = studentInput.value.trim();
      if (!/^[A-Za-z0-9_-]{3,40}$/.test(studentId)) {
        showStatus('请输入 3–40 位学号，只能包含字母、数字、下划线或短横线。', false);
        studentInput.focus();
        return;
      }
      button.disabled = true;
      button.textContent = '提交中…';
      try {
        const response = await fetch(`/activities/${activity.id}/register`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({student_id: studentId})
        });
        const result = await response.json();
        if (!response.ok) {
          const messages = {
            'already registered': '该学号已经报名过这个活动。',
            'activity is full': '活动名额已满。',
            'activity not found': '活动不存在。'
          };
          throw new Error(messages[result.detail] || result.detail || `报名失败（HTTP ${response.status}）`);
        }
        showStatus(`报名成功！${studentId} 已报名“${activity.name}”。`);
        await loadActivities();
      } catch (error) {
        showStatus(error.message, false);
        button.disabled = false;
        button.textContent = '立即报名';
      }
    }

    refreshButton.addEventListener('click', loadActivities);
    loadActivities();
  </script>
</body>
</html>

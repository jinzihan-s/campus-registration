apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: registration-api
  namespace: registration
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: registration-api
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
